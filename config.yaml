model:
  embed_dim: 128
  planet_temporal_layers: 2
  fleet_temporal_layers: 1
  local_layers: 4
  global_layers: 2
  num_heads: 8
  temporal_window: 20
  # ── ships head: surplus fraction Categorical ─────────────────────────────────
  # surplus = src.ships - required   (required = ETA forward-sim 도착 시 필요 함선)
  # ships_to_send = required + bin × max(0, surplus)   clipped to [1, src.ships]
  # bin=0   → just-capture (floor),  bin=1 → 올인 (src.ships 전부)
  # 모든 bin 이 의미적으로 다른 행동을 만들어내 gradient density 가 빡빡 (multiplier 방식 대비)
  ships_surplus_bins: [0.0, 0.33, 0.66, 1.0]

training:
  batch_size: 256
  minibatch_size: 128   # minibatch PPO용 — batch_size의 약수여야 함
  n_epochs: 4           # 같은 rollout을 몇 epoch 반복할지
  learning_rate: 0.0001
  total_timesteps: 10000000
  n_envs: 64            # CPU core 수 (1 thread/worker 기준)에 맞춤 — oversubscription 회피
  rollout_steps: 16384  # steps_per_env = 256 → 느린 워커 1 ep 유지, 빠른 워커가 유휴 시간에 추가 ep로 채움
  gamma: 1.0            # length invariance: 짧은/긴 에피소드 terminal 보상 동등
  gae_lambda: 0.95
  clip_range: 0.2
  target_kl: null       # 이 값 초과 시 PPO epoch 조기 종료 (None이면 비활성)
  ent_coef: 0.005       # 탐험 장려 엔트로피 계수
  vf_coef: 0.5          # Critic loss 가중치
  max_grad_norm: 0.5    # gradient clipping
  terminal_win_reward: 5.0  # 최종 승패 보상 절대값 (승=+v, 패=-v)
  dense_reward_coef: 0.004  # 중간 shaping은 약한 힌트만 주도록 축소
  cap_bonus_gain: 0.008     # 중립 → 내 점령 시 prod * 이 값 보너스
  cap_bonus_loss: 0.025     # 내 → 상실 시 prod * 이 값 페널티 (1차: 0.012→0.025, 방어 비용 강화)
  # Sprint 2: 발사 시 source 의 80%+ 비우는(all-in) 발사 페널티.
  # 1차 측정에서 all_in_launch_rate=0.94, remaining_ships_after_launch≈8 — policy가
  # 자원 무시 발사 default. cap_bonus_loss(잃을 때)와 별개 채널로 "발사 시점 보존"
  # 인센티브 추가. 0 으로 두면 비활성 (Sprint 1 baseline 재현).
  all_in_penalty: 0.01
  # 다중 source coordination penalty: 같은 turn 에 한 target 으로 보낸 함선 합이
  # required 를 초과한 만큼 함선당 패널티. 독립 head sample 의 over-send 협조 실패를
  # reward 차원에서 억제 (encoder attention 만으로는 sample correlation 이 안 잡힘).
  # 0 이면 비활성. 시작값은 작게 (0.0005~0.002 권장 — all_in_penalty 와 같은 스케일).
  over_send_penalty: 0.002
  # capacity-short launch 시도당 페널티 (음수). src.ships < required (도착 시점
  # 적 ships+1) 인 launch 는 점령 수학적 불가 = dominated action.
  # 1-A (prediction.py) 가 decode 단에서 ships=0 으로 차단하지만, target_mask 통과
  # 후 fixed-point oscillation 등으로 mask 가 못 잡는 케이스를 reward 로 추가 억제.
  # 0 이면 비활성. all_in_penalty 와 같은 스케일.
  under_invested_penalty: 0.01
  state_score_ship_weight: 0.1    # timeout 승자 판정(total ships)에 더 가깝게 정렬
  state_score_prod_weight: 0.5    # 생산력은 ships로 이어지는 간접 힌트만 유지
  state_score_planet_weight: 0.5  # planet_count 편향 완화 (기존 2.0에서 축소)

env:
  max_planets: 44   # 게임 최대 = 40 base (5-10 groups × 4) + 4 comets
  max_fleets: 140   # 2P 측정 p99≈78 기준 헤드룸 ×1.7 — 4P 측정 후 재조정
  history_turns: 20     # temporal window

selfplay:
  # A policy (2026-04): pool 편입은 매 gen, eval은 모니터링 전용 (gate 아님)
  eval_interval: 25     # N세대마다 main vs pool 승률 측정 — log/csv만, pool 편입엔 영향 없음
  win_threshold: 0.55   # (A policy 이후 gate 아님) log 비교용 reference로만 유지
  pool_size: 10         # 매 gen 편입 방식 — 시간 창 확보 위해 5→10 (pool이 덮는 gen 범위 2배)
  phase_early_steps: 500000    # early → mid 전환 기준 total_steps (phase_* 는 opponent_mix 도입 후 unused — 제거 예정)
  phase_mid_steps: 2000000     # mid → late 전환 기준 total_steps
  phase_min_league: 2          # early로 강제하는 최소 league 크기
  # 3-way 상대 분포 (2026-04): main rollout 상대를 self/league/exploiter에서 샘플.
  # league 비었거나 sample 실패 시 그 턴의 league 몫은 self로 재할당 (fallback).
  # exploiter 효용은 exploiter_eval 로그로 관찰 후 비율 재조정.
  opponent_mix:
    self: 0.3333
    league: 0.3333
    exploiter: 0.3334
