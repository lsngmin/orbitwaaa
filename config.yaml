model:
  embed_dim: 128
  planet_temporal_layers: 2
  fleet_temporal_layers: 1
  fleet_temporal: true      # false면 current-step fleet만 local_attn에 입력 (ablation B)
  local_layers: 2
  global_layers: 4
  num_heads: 8
  temporal_window: 20
  # ── ships head: required_ships 배수 Categorical ──────────────────────────────
  # ships_to_send = min(int(required × multiplier), src.ships)
  # required = target.ships + target.production × turns + 1
  # 1.00 미포함 (필연적 실패) — 1.10부터 시작 (margin 최소 10%)
  ships_multiplier_bins: [1.10, 1.30, 1.60, 2.00]

training:
  batch_size: 256
  minibatch_size: 128   # minibatch PPO용 — batch_size의 약수여야 함
  n_epochs: 4           # 같은 rollout을 몇 epoch 반복할지
  learning_rate: 0.0001
  total_timesteps: 10000000
  n_envs: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  target_kl: null       # 이 값 초과 시 PPO epoch 조기 종료 (None이면 비활성)
  ent_coef: 0.005       # 탐험 장려 엔트로피 계수
  vf_coef: 0.5          # Critic loss 가중치
  max_grad_norm: 0.5    # gradient clipping
  dense_reward_coef: 0.02   # dense reward 계수 (0이면 terminal-only)
  cap_bonus_gain: 0.05      # 중립 → 내 점령 시 prod * 이 값 보너스 (0이면 비활성)
  cap_bonus_loss: 0.025     # 내 → 상실 시 prod * 이 값 페널티 (0이면 비활성)

env:
  max_planets: 40
  max_fleets: 100
  history_turns: 20     # temporal window

selfplay:
  eval_interval: 50     # N세대마다 이전 버전과 대전
  win_threshold: 0.55   # 이 승률 넘어야 새 버전으로 교체
  pool_size: 5          # 대전 상대 풀 크기 (과거 버전 몇 개 유지)
  phase_early_steps: 500000    # early → mid 전환 기준 total_steps
  phase_mid_steps: 2000000     # mid → late 전환 기준 total_steps
  phase_min_league: 2          # early로 강제하는 최소 league 크기
