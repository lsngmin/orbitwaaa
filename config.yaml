model:
  embed_dim: 128
  temporal_layers: 2
  local_layers: 2
  global_layers: 4
  num_heads: 8
  temporal_window: 20

training:
  batch_size: 256
  learning_rate: 0.0003
  total_timesteps: 10000000
  n_envs: 64
  gamma: 0.99
  clip_range: 0.2
  ent_coef: 0.01        # 탐험 장려 엔트로피 계수
  vf_coef: 0.5          # Critic loss 가중치
  max_grad_norm: 0.5    # gradient clipping

env:
  max_planets: 40
  max_fleets: 100
  history_turns: 20     # temporal window

selfplay:
  eval_interval: 50     # N세대마다 이전 버전과 대전
  win_threshold: 0.55   # 이 승률 넘어야 새 버전으로 교체
  pool_size: 5          # 대전 상대 풀 크기 (과거 버전 몇 개 유지)
  phase_early_steps: 500000    # early → mid 전환 기준 total_steps
  phase_mid_steps: 2000000     # mid → late 전환 기준 total_steps
  phase_min_league: 2          # early로 강제하는 최소 league 크기
